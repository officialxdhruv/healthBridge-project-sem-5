name: healthbridge

services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.dev
    command: bun --watch src/index.ts
    working_dir: /app/apps/backend
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/healthbridge
      MONGODB_DB_NAME: healthbridge
      FRONTEND_URL: http://localhost:3001
    env_file:
      - path: apps/backend/.env
        required: false
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
      - backend_workspace_node_modules:/app/apps/backend/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    command: bun run dev --host
    working_dir: /app/apps/web
    ports:
      - "3001:3001"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_workspace_node_modules:/app/apps/web/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  backend_node_modules:
  backend_workspace_node_modules:
  web_node_modules:
  web_workspace_node_modules:
